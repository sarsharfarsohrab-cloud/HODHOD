# Tests and builds the app on every push to main. Cloudflare publishes the real app on
# https://apphodhod.com (see wrangler.jsonc). GitHub Pages now only serves a small page
# that sends visitors of the old address (…github.io/HODHOD/) to the new one, and a
# service worker that clears the old installed copy.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.x
      - name: Unit tests
        run: bun test tests/unit
      - name: Build
        run: bun run scripts/build.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
